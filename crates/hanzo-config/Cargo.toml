[package]
name = "hanzo-config"
# Never the release's version: only hanzo-dev carries it, so a release recompiles
# that crate alone. Not published.
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
description = "Hanzo Dev config integration"
repository = "https://github.com/hanzoai/dev"

[dependencies]
hanzo = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
