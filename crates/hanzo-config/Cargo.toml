[package]
name = "hanzo-config"
# Never the release's version: upstream crates depend on this one, and a version
# that moved would recompile everything above them. Not published.
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
description = "Hanzo Dev config integration"
repository = "https://github.com/hanzoai/dev"

[dependencies]
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
