[package]
name = "dev-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dev_orchestrator"
path = "src/lib.rs"

[lints]
workspace = true

# Pure like dev-core: a dependency here must not reach a filesystem, process,
# socket, clock or async runtime. It is built native and for wasm32-wasip1.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
