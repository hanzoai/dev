[package]
name = "hanzo-kai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kai in the Dev loop over the Decisions API: decisions per turn, their trace, and flows."

[lints]
workspace = true

[dependencies]
hanzo-config = { path = "../hanzo-config", version = "0.7.0-dev.1" }
hanzo-loop = { path = "../hanzo-loop", version = "0.7.0-dev.1" }
chrono = { workspace = true }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-protocol = { workspace = true }
futures = { workspace = true, features = ["std"] }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
# Option order is a question's meaning: a choice's labels are its options in order.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
