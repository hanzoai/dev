[package]
name = "hanzo-kai"
# Never the release's version: only hanzo-dev carries it, so a release recompiles
# that crate alone. Not published.
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
description = "Kai in the Dev loop over the Decisions API: decisions per turn, their trace, and flows."

[lints]
workspace = true

[dependencies]
hanzo-config = { workspace = true }
hanzo = { workspace = true }
# Hanzo's one search engine (tgrep), the library hanzo-mcp's search actions run on.
hanzo-trigram = { git = "https://github.com/hanzoai/mcp", rev = "e9e6096ce46c3d3bf61e6830de6487a5b5b5b849" }
chrono = { workspace = true }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-protocol = { workspace = true }
futures = { workspace = true, features = ["std"] }
indexmap = { workspace = true, features = ["serde"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
# Option order is a question's meaning: a choice's labels are its options in order.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
wiremock = { workspace = true }
