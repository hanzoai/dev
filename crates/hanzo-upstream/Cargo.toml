# A detached workspace: the root workspace cannot resolve until this tool has
# materialized .build, so this must compile on its own.
[workspace]

[package]
name = "hanzo-upstream"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
