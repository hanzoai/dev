[package]
name = "hanzo-loop"
# Never the release's version: upstream crates depend on this one, and a version
# that moved would recompile everything above them. Not published.
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
description = "What a controller decides inside the agent loop, as data the loop applies."

[lints]
workspace = true

# The agent loop depends on this crate, so it stays small and changes rarely: the loop is
# rebuilt whenever it does.
[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
