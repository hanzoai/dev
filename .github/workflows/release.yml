# Release — a tag `vX.Y.Z` ships `dev` at that version, from the Linux pool.
#
# The version is assigned by hand, never computed here: a person sets it in the
# root Cargo.toml's [workspace.package] and in npm/package.json, commits, and
# pushes the tag `v<that version>`. This workflow refuses a tag that either
# manifest does not say and writes no commit, no tag and no version anywhere.
# (Until 2026-10-15 every push to main took the next patch above whatever was
# published and committed the bump back; the owner's rule is that no pipeline
# mints a semver.)
#
# THIS FILE LIVES IN .github/workflows BECAUSE GITHUB READS NOTHING ELSE. From
# 2026-09-08 it sat in .hanzo/workflows, where GitHub never looks and the forge,
# which mirrors this repository, runs nothing: nineteen days of pushes to main
# released nothing, and the only trace was a draft v0.6.107 with no assets.
#
# The jobs that build run on the xl pool (`xl-linux-amd64`): a 32 vCPU / 56 GiB
# node to each, so five builds no longer share one 8-CPU node and each rustc gets
# a core. `version` and `publish` only call APIs and move files, and run on the
# ordinary pool. A runner has uid 1001, no root (`sudo` answers "effective uid is
# not 0"), and an image with cc, make, curl, jq, tar, xz, zstd, zip, git, python3
# and node; it has no LLVM and no Rust. So nothing here installs a package: a
# step checks what it needs and names what is missing, Rust comes from rustup
# into $HOME, and the Windows build takes clang-cl from a pinned LLVM release.
#
# No macOS or Windows runner is needed, and none is used: `cargo-zigbuild`
# cross-links the darwin targets against a vendored, checksum-pinned MacOSX
# SDK and the musl targets natively, and `cargo-xwin` builds windows-msvc with
# LLVM's clang-cl — all from ordinary amd64 containers, five at once.
#
# Shape: `version` reads the version off the tag, holds Cargo.toml and
# npm/package.json to it and opens a DRAFT GitHub release for the tag; five
# `build` jobs each compile one target and upload its assets into the draft by
# id; `publish` verifies all 28 assets, publishes the release, publishes npm
# (five platform packages, then @hanzo/dev) and pushes the Homebrew formula to
# the tap. The forge mirrors this repository, tags included, so nothing here
# pushes to it.
#
# A runner lives for one job, so each build would compile all ~1,000 crates
# from nothing. sccache wraps every rustc call and keys each object by the hash
# of what went into it, and hanzoai/ci's bin/cache carries those objects and the
# crate downloads to the next run through this org's store (/v1/s3, the IAM
# identity KMS mints, no bucket credential).
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
concurrency:
  # One run of a ref at a time, so a rerun of a tag cannot race its own draft.
  # Two refs do not wait on each other: each build owns a node.
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  # The two cross-build drivers are the projects' own musl release binaries, not
  # `cargo install`: compiling them cost every job a minute and a half.
  ZIGBUILD_VERSION: '0.23.0'
  ZIGBUILD_SHA256: 'f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4'
  LLVM_VERSION: '21.1.2'
  LLVM_SHA256: '38dc1e278b8d688d9f4f1077da1dcda623d9e0dd89ffcf03bc18d3492bbd9cb6'
  # Named away from XWIN_VERSION on purpose: cargo-xwin reads that env as its
  # --xwin-version flag (the Windows SDK manifest), and a crate version there
  # kills every msvc build with "invalid digit found in string".
  XWIN_CRATE_VERSION: '0.23.1'
  XWIN_CRATE_SHA256: 'c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360'
  MACOS_SDK_URL: 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz'
  MACOS_SDK_SHA256: 'cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4'
  # The musl release tarball, by version and by its sha256 per runner arch.
  SCCACHE_VERSION: '0.18.0'
  SCCACHE_SHA256_X86_64: '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89'
  SCCACHE_SHA256_AARCH64: '2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a'
  # hanzoai/ci at the commit whose bin/cache this release runs.
  CI_SHA: '7ee0655f921b9d0b893c5a5decf6804c468a5884'
jobs:
  version:
    runs-on: [linux-amd64]
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      built: ${{ steps.v.outputs.built }}
    steps:
      # The tag's commit and nothing else, no history and no engine: this job
      # reads manifests and scripts. A full clone with the engine's whole
      # history took 3.9 of `version`'s 4.1 minutes and 2.5 of `publish`'s 6.9.
      - uses: actions/checkout@v4
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: The version is the tag's, and the draft that will hold it
        id: v
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*) v=${GITHUB_REF_NAME#v} ;;
            *) if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ]; then
                 v=$(jq -r .version npm/package.json)
               else
                 echo "::error::a release runs from a tag vX.Y.Z, not $GITHUB_REF: set npm/package.json's version, commit, and push the tag"; exit 1
               fi ;;
          esac
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          m=$(jq -r .version npm/package.json)
          [ "$m" = "$v" ] || { echo "::error::the tag says $v and npm/package.json says $m: the version is assigned by hand, in the manifests, before the tag"; exit 1; }
          c=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$c" = "$v" ] || { echo "::error::the tag says $v and Cargo.toml's [workspace.package] says $c: the version is assigned by hand, in the manifests, before the tag"; exit 1; }
          . scripts/ghapi.sh
          # The whole release makes about 66 calls on an account's 5,000 an hour.
          # Better to know now, for the price of one free call, than after the build.
          ghapi_budget 100
          # A rerun of the same tag finds its own draft; if the release is already
          # published with all 28 assets and only downstream registries remain,
          # skip the build matrix and resume publish.
          rel=$(ghapi GET "https://api.github.com/repos/hanzoai/dev/releases?per_page=100" \
            | jq -r --arg t "v$v" '.[] | select(.tag_name == $t) | "\(.id) \(.draft)"' | head -1)
          built=false
          case "$rel" in
            "") # Once: a repeat after a lost answer could open a second draft.
                rel=$(GHAPI_TRIES=1 ghapi POST https://api.github.com/repos/hanzoai/dev/releases \
                  -d "$(jq -nc --arg t "v$v" --arg n "Release v$v" --arg sha "$GITHUB_SHA" \
                    '{tag_name:$t,name:$n,target_commitish:$sha,draft:true}')" | jq -r '.id // empty')
                [ -n "$rel" ] || { echo "::error::could not open the draft release"; exit 1; } ;;
            *" true") rel=${rel% true} ;;
            *" false") rel=${rel% true}; rel=${rel% false} ;;
          esac
          n=$(ghapi GET "https://api.github.com/repos/hanzoai/dev/releases/$rel/assets?per_page=100" | jq length)
          [ "$n" -ne 28 ] || built=true
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "release v$v from $GITHUB_REF_NAME — release $rel (built=$built)"

  build:
    name: ${{ matrix.target.id }}
    needs: version
    if: needs.version.outputs.built != 'true'
    # xl: a 32 vCPU / 56 GiB node to this job alone (cloud apps/platform/job.go,
    # universe infra/aws pool.tf). On the ordinary pool the five builds shared one
    # 8-CPU node, each got under 2 CPUs, and a build took 60 to 90 minutes.
    # The pool is shared with cloud's and hanzo.ai's gates, so a job can wait for
    # its node; LLM.md, "The release run", has what that has cost.
    runs-on: [xl-linux-amd64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # No max-parallel. The platform starts one runner per job when the job is
      # queued, and a job held back by max-parallel waits past that runner's
      # life: on 2026-09-27 linux-amd64 built in 22 minutes and the four
      # targets queued behind it never got a runner.
      matrix:
        target:
          - { id: linux-amd64,   rust: x86_64-unknown-linux-musl }
          - { id: linux-arm64,   rust: aarch64-unknown-linux-musl }
          - { id: darwin-amd64,  rust: x86_64-apple-darwin,  apple: true }
          - { id: darwin-arm64,  rust: aarch64-apple-darwin, apple: true }
          - { id: windows-amd64, rust: x86_64-pc-windows-msvc, msvc: true }
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: -Awarnings -C debuginfo=0 -C strip=symbols
      # Thin LTO's final link of this binary took 14 GB on one runner, and on
      # 2026-10-08 three of them on one 32 GB node ran it out of memory: a system
      # OOM, the node went NotReady, and every build on it was evicted. Without LTO
      # the link needs a fraction of that memory and time, for a larger binary.
      #
      # `false` is cargo's thin LOCAL LTO, between a crate's own codegen units;
      # `off` is none. Measured on hanzo-dev, the last crate and the longest, local
      # LTO is 95 of its 215 seconds, and `off` takes a cold build from 25 minutes
      # to 21. Changing it changes every object (one cold build) and the shipped
      # binary, so it stays what it was until the owner says.
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain deps
        run: |
          set -euo pipefail
          missing=""
          for t in cc make perl curl jq tar xz zstd zip sha256sum; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::the runner lacks:$missing"; exit 1; }
          echo "the toolchain is here"
      - name: Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; }
          export PATH="$HOME/.cargo/bin:$PATH"; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          CH=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$CH" --profile minimal
          rustup target add --toolchain "$CH" ${{ matrix.target.rust }}
      - name: sccache, and the org's cache tool
        # sccache keys an object by the hash of what went into it — source
        # bytes, flags, the compiler, the CARGO_* environment — never by mtime,
        # so a fresh checkout hits wherever the bytes did not move. The wrapper
        # is set for every later step: cargo-zigbuild and cargo-xwin both run
        # rustc through it, and cc-rs routes the C the crates carry through it
        # too.
        #
        # An accelerator, not a dependency: a download that fails or does not
        # match its pin leaves RUSTC_WRAPPER unset and the build runs cold.
        run: |
          set +e   # GitHub runs this under bash -e; nothing in this step may fail the build
          set -uo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64; want=$SCCACHE_SHA256_X86_64 ;;
            aarch64) arch=aarch64; want=$SCCACHE_SHA256_AARCH64 ;;
            *) echo "::notice::no sccache is pinned for $(uname -m), so this build runs cold"; exit 0 ;;
          esac
          n="sccache-v${SCCACHE_VERSION}-${arch}-unknown-linux-musl"
          d="$RUNNER_TEMP/sccache-bin"; mkdir -p "$d"
          curl -fsSL -m 120 "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/$n.tar.gz" -o "$d/s.tgz" \
            || { echo "::notice::sccache did not download, so this build runs cold"; exit 0; }
          echo "$want  $d/s.tgz" | sha256sum -c --quiet - \
            || { echo "::warning::$n.tar.gz does not match its pinned sha256; it is not run, and this build runs cold"; exit 0; }
          if ! { tar -xzf "$d/s.tgz" -C "$d" --strip-components=1 "$n/sccache" && "$d/sccache" --version; }; then
            echo "::notice::sccache did not unpack, so this build runs cold"; exit 0
          fi
          # No idle timeout: one crate on a crowded node can compile for longer
          # than the default ten minutes, and a server that left mid-build would
          # split the statistics printed at the end.
          {
            echo "RUSTC_WRAPPER=$d/sccache"
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
            echo "SCCACHE_CACHE_SIZE=15G"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"
          echo "$d" >> "$GITHUB_PATH"
          if curl -fsSL -m 60 "https://raw.githubusercontent.com/hanzoai/ci/$CI_SHA/bin/cache" -o "$RUNNER_TEMP/cache"; then
            chmod +x "$RUNNER_TEMP/cache"
          else
            echo "::notice::hanzoai/ci@$CI_SHA bin/cache did not download, so nothing is carried between runs"
          fi
      - name: Restore the Rust cache (this org's store)
        # The name is what an archive is only valid for: the compiler, the host
        # it runs on, sccache's own version, and the target. The key is what
        # decides its contents: the upstream pin, the toolchain pin, the root
        # manifest and the lock, and every flag and cross-toolchain pin in the
        # environment, which sccache hashes too. Two things are left out on
        # purpose, because every release moves them and neither can serve the
        # next one: the release's version (the line in the root manifest and
        # hanzo-dev's line in the lock, the one crate that carries it) and
        # crates/ (Dev's own, which a release rebuilds). So a Dev-only release
        # restores its own key exactly, finds every engine object, compiles what
        # it changed and saves nothing; a release that moves the pin or the lock
        # misses its key, restores the newest key saved for that name,
        # recompiles what moved, and saves the new key.
        #
        # The Windows build also carries what it would otherwise fetch and
        # unpack on every run: the pruned LLVM (a 5 GB xz stream, minutes to read
        # for four files) and cargo-xwin's Windows SDK.
        #
        # The IAM token is minted here and handed to bin/cache alone, never to
        # GITHUB_ENV: the Build step runs every crate's build script and proc
        # macro, and none of them needs this org's identity.
        id: rustcache
        if: env.RUSTC_WRAPPER != ''
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          TARGET: ${{ matrix.target.rust }}
          MSVC: ${{ matrix.target.msvc }}
        run: |
          set +e   # GitHub runs this under bash -e; nothing in this step may fail the build
          set -uo pipefail
          [ -x "$RUNNER_TEMP/cache" ] || { echo "::notice::no bin/cache, so this build starts cold"; exit 0; }
          name="$({ rustc -vV; sccache --version; } | sha256sum | cut -c1-16)-$TARGET"
          key=$({ git ls-tree HEAD -- upstream/codex rust-toolchain.toml
                  sed '/^\[workspace.package\]/,/^\[/{/^version = /d}' Cargo.toml
                  sed '/^name = "hanzo-dev"$/{n;d}' Cargo.lock
                  env | grep -E '^(RUSTFLAGS|CARGO_[A-Z0-9_]+|ZIG[A-Z0-9_]*|LLVM_[A-Z0-9_]+|XWIN_[A-Z0-9_]+|MACOS_SDK_[A-Z0-9_]+)=' | sort
                } | sha256sum | cut -c1-32)
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "key=$key" >> "$GITHUB_OUTPUT"
          T=$(printf '{"clientId":"%s","clientSecret":"%s"}' "${KMS_CLIENT_ID:-}" "${KMS_CLIENT_SECRET:-}" \
            | curl -sS -m 30 "${KMS_ENDPOINT:-https://api.hanzo.ai}/v1/kms/auth/login" -H 'Content-Type: application/json' -d @- \
            | jq -r '.accessToken // empty' 2>/dev/null)
          if [ -n "$T" ]; then echo "::add-mask::$T"; else echo "::notice::KMS gave no IAM token, so the org store is not used"; fi
          h=${CARGO_HOME:-$HOME/.cargo}
          dirs=(sccache="$SCCACHE_DIR" index="$h/registry/index" crates="$h/registry/cache" git="$h/git/db")
          [ "$MSVC" != true ] || dirs+=(llvm="$HOME/llvm" xwin="$HOME/.cache/cargo-xwin")
          HANZO_API_TOKEN=$T "$RUNNER_TEMP/cache" restore "$name" "$key" "${dirs[@]}"
          # What this build reads or writes from here on is its working set;
          # everything older is pruned before the save.
          touch "$RUNNER_TEMP/sccache.since"
      - name: Zig and cargo-zigbuild (the cross-linker)
        if: ${{ !matrix.target.msvc }}
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz" \
            || curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          # It goes where `cargo install` put it, and that is load-bearing: it
          # names the linker wrapper it hands cargo after a hash of its own path,
          # cargo passes that name to every rustc as CARGO_TARGET_*_LINKER, and
          # sccache hashes it into every object. From another directory the first
          # build found no object at all and took 24 minutes instead of 5.
          n=cargo-zigbuild-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ZIGBUILD_VERSION}/$n.tar.xz" -o "$RUNNER_TEMP/zigbuild.tar.xz"
          echo "${ZIGBUILD_SHA256}  $RUNNER_TEMP/zigbuild.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin" && tar -xf "$RUNNER_TEMP/zigbuild.tar.xz" -C "$HOME/.cargo/bin" --strip-components=1 "$n/cargo-zigbuild"
      - name: Vendor macOS SDK
        if: ${{ matrix.target.apple }}
        run: |
          set -euo pipefail
          curl -fsSL "${MACOS_SDK_URL}" -o macsdk.tar.xz
          echo "${MACOS_SDK_SHA256}  macsdk.tar.xz" | sha256sum -c -
          tar -xf macsdk.tar.xz -C "$HOME"
          echo "SDKROOT=$HOME/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: LLVM and cargo-xwin for windows-msvc
        # clang-cl compiles the C the crates carry, lld-link links, llvm-lib
        # archives: three names for two binaries of one LLVM release. Only those
        # and clang's own headers leave the tarball, and the cache restore above
        # has already put them back unless this is the first run to need them.
        if: ${{ matrix.target.msvc }}
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/llvm/bin/clang" ]; then
            curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" -o "$RUNNER_TEMP/llvm.tar.xz"
            echo "${LLVM_SHA256}  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/llvm"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards \
              '*/bin/clang' '*/bin/clang-[0-9]*' '*/bin/lld' '*/bin/llvm-ar' '*/lib/clang/*'
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          ln -sf clang "$HOME/llvm/bin/clang-cl"
          ln -sf lld "$HOME/llvm/bin/lld-link"
          ln -sf llvm-ar "$HOME/llvm/bin/llvm-lib"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          "$HOME/llvm/bin/clang-cl" --version | head -1
          curl -fsSL "https://github.com/rust-cross/cargo-xwin/releases/download/v${XWIN_CRATE_VERSION}/cargo-xwin-v${XWIN_CRATE_VERSION}.x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/xwin.tar.gz"
          echo "${XWIN_CRATE_SHA256}  $RUNNER_TEMP/xwin.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin" && tar -xzf "$RUNNER_TEMP/xwin.tar.gz" -C "$HOME/.cargo/bin" cargo-xwin
      - name: Build
        # The release's version is hanzo-dev's own (the root manifest's, which
        # the version job held to the tag). Its main hands it to hanzo-version,
        # and every reader beneath asks that at run time; Dev's libraries stay
        # 0.0.0. So every crate under the binary is the same from one release
        # to the next, and the cache serves them.
        #
        # hanzo-dev is the last crate and the longest: nothing waits on it but the
        # link, and its LLVM work (175 of its 215 seconds) runs only four codegen
        # units wide on a node with thirty idle cores. Sixteen take it from 228 to
        # 187 seconds. Only this crate: the engines keep upstream's four, so their
        # cached objects and the code they compile to do not move.
        run: |
          set -euo pipefail
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          # Hits, misses and why a call was not cacheable, on the log, whether or not the build passes.
          # Guarded: under -e a failing trap would turn a passing build red.
          trap '[ -z "${RUSTC_WRAPPER:-}" ] || sccache --show-stats || true' EXIT
          wide=(--config 'profile.release.package.hanzo-dev.codegen-units=16')
          case "${{ matrix.target.rust }}" in
            *apple-darwin|*linux-musl) cargo zigbuild --release --locked "${wide[@]}" --target ${{ matrix.target.rust }} --bin dev ;;
            *windows-msvc)             cargo xwin build --release --locked "${wide[@]}" --target ${{ matrix.target.rust }} --bin dev ;;
          esac
      - name: Save the Rust cache (this org's store)
        # After a green build, so what is saved is what a passing build
        # compiled. bin/cache writes only from main or a tag, and only a key the
        # store does not hold yet.
        #
        # The server stops first, so every object is on disk. Then whatever
        # this build neither read nor wrote goes: sccache stamps an object's
        # mtime when it hits, and the registry keeps the crates this build
        # unpacked. So an archive is one build's working set and never grows
        # with the builds before it.
        if: steps.rustcache.outputs.key != '' && steps.rustcache.outputs.hit != 'exact'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          NAME: ${{ steps.rustcache.outputs.name }}
          KEY: ${{ steps.rustcache.outputs.key }}
          MSVC: ${{ matrix.target.msvc }}
        run: |
          set +e   # GitHub runs this under bash -e; nothing in this step may fail the build
          set -uo pipefail
          sccache --stop-server >/dev/null 2>&1 || true
          find "$SCCACHE_DIR" -type f ! -newer "$RUNNER_TEMP/sccache.since" -delete 2>/dev/null
          h=${CARGO_HOME:-$HOME/.cargo}
          for c in "$h"/registry/cache/*/; do
            i=$(basename "$c")
            for f in "$c"*.crate; do [ -d "$h/registry/src/$i/$(basename "$f" .crate)" ] || rm -f "$f"; done
          done
          T=$(printf '{"clientId":"%s","clientSecret":"%s"}' "${KMS_CLIENT_ID:-}" "${KMS_CLIENT_SECRET:-}" \
            | curl -sS -m 30 "${KMS_ENDPOINT:-https://api.hanzo.ai}/v1/kms/auth/login" -H 'Content-Type: application/json' -d @- \
            | jq -r '.accessToken // empty' 2>/dev/null)
          if [ -n "$T" ]; then echo "::add-mask::$T"; else echo "::notice::KMS gave no IAM token, so the org store is not used"; fi
          dirs=(sccache="$SCCACHE_DIR" index="$h/registry/index" crates="$h/registry/cache" git="$h/git/db")
          [ "$MSVC" != true ] || dirs+=(llvm="$HOME/llvm" xwin="$HOME/.cache/cargo-xwin")
          HANZO_API_TOKEN=$T "$RUNNER_TEMP/cache" save "$NAME" "$KEY" "${dirs[@]}"
      - name: Package
        # The archives are independent, so they compress side by side; a bare
        # `wait` would report success for a child that failed, so each is waited
        # for by its pid.
        run: |
          set -euo pipefail
          t=${{ matrix.target.rust }}; short=${{ matrix.target.id }}
          bin="target/$t/release/dev"; mkdir -p dist; d=$(mktemp -d); pids=()
          if [ "$short" = windows-amd64 ]; then
            cp "$bin.exe" "$d/dev-$t.exe"; cp "$bin.exe" "$d/dev.exe"
            (cd "$d" && zip -q "$OLDPWD/dist/dev-$t.exe.zip" "dev-$t.exe") & pids+=($!)
            tar -C "$d" -czf "dist/dev-$short.tar.gz" dev.exe & pids+=($!)
          else
            cp "$bin" "$d/dev-$t"; cp "$bin" "$d/dev"
            tar -C "$d" -czf "dist/dev-$t.tar.gz" "dev-$t" & pids+=($!)
            zstd -q -19 -T0 "$d/dev-$t" -o "dist/dev-$t.zst" & pids+=($!)
            tar -C "$d" -czf "dist/dev-$short.tar.gz" dev & pids+=($!)
          fi
          for p in "${pids[@]}"; do wait "$p"; done
          (cd dist && for f in *; do case "$f" in *.sha256) ;; *) sha256sum "$f" > "$f.sha256";; esac; done)
          ls -la dist
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: Upload into the draft
        # One list for the job and one call per file. A call that GitHub refuses
        # for the rate limit is waited out and asked again (scripts/ghapi.sh); an
        # upload whose answer was lost may have made its asset, so the name is
        # cleared and the file sent again, twice at most.
        env:
          REL: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          . scripts/ghapi.sh
          api=https://api.github.com/repos/hanzoai/dev/releases
          have() { ghapi GET "$api/$REL/assets?per_page=100" | jq -r '.[] | "\(.id) \(.name)"'; }
          clear() { # clear <name>: the draft's asset of that name, if it holds one, goes
            local id
            for id in $(awk -v n="$1" '$2 == n { print $1 }' <<<"$assets"); do ghapi DELETE "$api/assets/$id" >/dev/null; done
          }
          assets=$(have)
          for f in dist/*; do
            n=$(basename "$f")
            clear "$n"
            for try in 1 2 3; do
              GHAPI_TRIES=3 ghapi POST "https://uploads.github.com/repos/hanzoai/dev/releases/$REL/assets?name=$n" \
                -H 'Content-Type: application/octet-stream' --data-binary @"$f" >/dev/null && break
              [ "$try" -lt 3 ] || { echo "::error::$n did not upload"; exit 1; }
              assets=$(have); clear "$n"
            done
            echo "uploaded $n"
          done

  publish:
    needs: [version, build]
    # Only a tag, or the default branch resuming one, publishes. A run from any
    # other ref builds into a draft and stops there.
    if: >-
      always() && needs.version.result == 'success'
      && (needs.build.result == 'success' || needs.version.outputs.built == 'true')
      && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: [linux-amd64]
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
    steps:
      # The tag's commit and nothing else, no history and no engine: this job
      # reads manifests and scripts. A full clone with the engine's whole
      # history took 3.9 of `version`'s 4.1 minutes and 2.5 of `publish`'s 6.9.
      - uses: actions/checkout@v4
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          set -euo pipefail
          missing=""
          for t in curl jq git zstd node npm sha256sum; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::the runner lacks:$missing"; exit 1; }
          echo "the tools are here"
      - name: Every asset is present, then the release is real
        run: |
          set -euo pipefail
          . scripts/ghapi.sh
          mkdir -p dist
          ghapi GET "https://api.github.com/repos/hanzoai/dev/releases/$REL/assets?per_page=100" > /tmp/assets.json
          n=$(jq length /tmp/assets.json)
          [ "$n" -eq 28 ] || { echo "::error::draft holds $n assets, want 28 — a target is missing"; jq -r '.[].name' /tmp/assets.json; exit 1; }
          # Bytes need octet-stream ALONE: the auth array's vnd.github Accept
          # beside it made GitHub answer with asset metadata JSON, and every
          # "downloaded" file was the same twenty lines of JSON.
          # Eight at a time; xargs exits non-zero if any one download failed.
          jq -r '.[] | "\(.id) \(.name)"' /tmp/assets.json | xargs -P 8 -L 1 bash -c \
            '. scripts/ghapi.sh; GHAPI_ACCEPT=application/octet-stream GHAPI_TO="dist/$1" \
              ghapi GET "https://api.github.com/repos/hanzoai/dev/releases/assets/$0" -L'
          (cd dist && printf '%s\n' *.sha256 | xargs -P 8 -n 1 sha256sum -c --quiet)
          echo "28 assets present and checksum-clean"
          # The release runs what it ships: the linux binary is native to this
          # runner, so it answers for the whole matrix that the artifacts are
          # programs, not just well-named bytes.
          x=$(mktemp -d); tar -xzf dist/dev-linux-amd64.tar.gz -C "$x"
          "$x/dev" --version | grep -qF "$V" || { echo "::error::the shipped binary does not say $V"; "$x/dev" --version; exit 1; }
          "$x/dev" completion bash >/dev/null
          echo "smoked: $("$x/dev" --version)"
          ghapi PATCH "https://api.github.com/repos/hanzoai/dev/releases/$REL" \
            -d '{"draft":false}' | jq -r '"published: " + .html_url'
      - name: Publish Homebrew formula
        run: |
          set -euo pipefail
          RELEASE_ASSETS_DIR=dist bash scripts/generate-homebrew-formula.sh "$V"
          grep -q "version \"$V\"" Formula/hanzo-dev.rb
          tap=$RUNNER_TEMP/tap; rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_PAT@github.com/hanzoai/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula" && cp Formula/hanzo-dev.rb "$tap/Formula/hanzo-dev.rb"
          cd "$tap"
          git -c user.name="Zach Kelling" -c user.email=z@zeekay.io commit -qam "hanzo-dev $V" && git push -q || echo "formula unchanged"
      - name: Publish npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          GH_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          # Asked again on an error. This runs after the release is public, and
          # one error answer from KMS (seen once, exit 22 in half a second) would
          # leave npm unpublished until someone reruns the job.
          T=$(curl -sf --retry 3 --retry-delay 2 --retry-all-errors "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r '.accessToken // empty')
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          NPM_TOKEN=""
          for path in secrets/NPM_TOKEN secrets/deploy/NPM_TOKEN orgs/hanzo/secrets/NPM_TOKEN; do
            cand=$(curl -sf "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T" | jq -r '.value // .secret.value // empty' || true)
            [ -n "$cand" ] || continue
            echo "::add-mask::$cand"
            echo "//registry.npmjs.org/:_authToken=$cand" > "$NPM_CONFIG_USERCONFIG"
            if npm whoami --registry https://registry.npmjs.org >/dev/null 2>&1; then NPM_TOKEN="$cand"; break; fi
          done
          if [ -z "$NPM_TOKEN" ]; then
            for cand in "${GH_NPM_TOKEN:-}" "${GH_NPM_AUTH_TOKEN:-}"; do
              [ -n "$cand" ] && [ "${#cand}" -ge 8 ] || continue
              echo "::add-mask::$cand"
              echo "//registry.npmjs.org/:_authToken=$cand" > "$NPM_CONFIG_USERCONFIG"
              if npm whoami --registry https://registry.npmjs.org >/dev/null 2>&1; then NPM_TOKEN="$cand"; break; fi
            done
          fi
          [ -n "$NPM_TOKEN" ] || { echo "::warning::No valid NPM_TOKEN in KMS (secrets/NPM_TOKEN) or GitHub Secrets (npm whoami failed); skipping npm publish until NPM_TOKEN is rotated"; exit 0; }
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          rm -rf "$RUNNER_TEMP/npm"; mkdir -p "$RUNNER_TEMP/npm"
          plat() { # plat <triple> <os> <cpu> <pkg> <short>
            local t=$1 os=$2 cpu=$3 pkg=$4 short=$5 d="$RUNNER_TEMP/npm/${4##*/}" x="$RUNNER_TEMP/npm/x-${4##*/}"
            # npm never takes a version twice: a rerun goes past what it already holds.
            if npm view "$pkg@$V" version >/dev/null 2>&1; then echo "$pkg@$V is published"; return 0; fi
            rm -rf "$x"; mkdir -p "$x" "$d/bin"
            tar -xzf "dist/dev-$short.tar.gz" -C "$x"
            if [ "$os" = win32 ]; then mv "$x/dev.exe" "$d/bin/dev-$t.exe"; else mv "$x/dev" "$d/bin/dev-$t"; chmod +x "$d/bin/dev-$t"; fi
            jq -n --arg n "$pkg" --arg v "$V" --arg t "$t" --arg os "$os" --arg cpu "$cpu" \
              '{name:$n,version:$v,license:"Apache-2.0",description:("Platform binary for @hanzo/dev ("+$t+")"),os:[$os],cpu:[$cpu],files:["bin/"]}' > "$d/package.json"
            (cd "$d" && npm publish --access public)
          }
          # The five platform packages are independent, so they go up together;
          # the launcher goes after all of them, and each is waited for by its pid
          # because a bare `wait` would report success for one that failed.
          pids=()
          plat aarch64-apple-darwin darwin arm64 @hanzo/dev-darwin-arm64 darwin-arm64 & pids+=($!)
          plat x86_64-apple-darwin darwin x64 @hanzo/dev-darwin-x64 darwin-amd64 & pids+=($!)
          plat x86_64-unknown-linux-musl linux x64 @hanzo/dev-linux-x64-musl linux-amd64 & pids+=($!)
          plat aarch64-unknown-linux-musl linux arm64 @hanzo/dev-linux-arm64-musl linux-arm64 & pids+=($!)
          plat x86_64-pc-windows-msvc win32 x64 @hanzo/dev-win32-x64 windows-amd64 & pids+=($!)
          failed=0; for p in "${pids[@]}"; do wait "$p" || failed=1; done
          [ "$failed" = 0 ] || { echo "::error::a platform package did not publish"; exit 1; }
          # The launcher package lives in npm/ (it was codex-cli/ until the front
          # door moved it), and it names its dependencies as pnpm catalog
          # entries, which npm would publish verbatim and no installer resolves:
          # each `catalog:` becomes the version pnpm-workspace.yaml gives it.
          cp README.md npm/README.md
          cd npm
          [ "$(jq -r .version package.json)" = "$V" ] || { echo "::error::npm/package.json says $(jq -r .version package.json), the tag $V"; exit 1; }
          python3 - <<'PY'
          import json, re
          catalog, inside = {}, False
          for line in open("../pnpm-workspace.yaml"):
              if re.match(r"^catalog:\s*$", line):
                  inside = True
                  continue
              if inside and line.strip() and not line.startswith(" "):
                  break
              m = inside and re.match(r"""^\s+['"]?([^'":]+)['"]?\s*:\s*['"]?([^'"\s]+)""", line)
              if m:
                  catalog[m.group(1)] = m.group(2)
          p = json.load(open("package.json"))
          for field in ("dependencies", "devDependencies", "optionalDependencies"):
              for name, spec in p.get(field, {}).items():
                  if spec == "catalog:":
                      if name not in catalog:
                          raise SystemExit(f"{name}: catalog: names no catalog entry")
                      p[field][name] = catalog[name]
          open("package.json", "w").write(json.dumps(p, indent=2) + "\n")
          PY
          t=$(mktemp); jq --arg v "$V" '.optionalDependencies |= with_entries(.value=$v)' package.json > "$t" && mv "$t" package.json
          if npm view "@hanzo/dev@$V" version >/dev/null 2>&1; then echo "@hanzo/dev@$V is published"; else CI=true npm publish --access public; fi
          git checkout -- README.md 2>/dev/null || true
