# Release — every push to main ships `dev`, from the Linux pool.
#
# THIS FILE LIVES IN .github/workflows BECAUSE GITHUB READS NOTHING ELSE. From
# 2026-09-08 it sat in .hanzo/workflows, where GitHub never looks and the forge,
# which mirrors this repository, runs nothing: nineteen days of pushes to main
# released nothing, and the only trace was a draft v0.6.107 with no assets.
#
# The runner is a sandbox: uid 1001, no root (`sudo` answers "effective uid is
# not 0"), 6 CPUs, 24 GB. Its image carries cc, make, curl, jq, tar, xz, zstd, zip,
# git, python3 and node; it has no LLVM and no Rust. So nothing here installs a
# package: a step checks what it needs and names what is missing, Rust comes
# from rustup into $HOME, and the Windows build takes clang-cl from a pinned
# LLVM release.
#
# No macOS or Windows runner is needed, and none is used: `cargo-zigbuild`
# cross-links the darwin targets against a vendored, checksum-pinned MacOSX
# SDK and the musl targets natively, and `cargo-xwin` builds windows-msvc with
# LLVM's clang-cl — all from ordinary amd64 containers, five at once.
#
# Shape: `version` computes the next patch above everything already published
# and opens a DRAFT GitHub release; five `build` jobs each compile one target
# and upload its assets into the draft by id; `publish` verifies all 28
# assets, publishes the release (which mints the tag), publishes npm (five
# platform packages, then @hanzo/dev), pushes the Homebrew formula, and lands
# the version-bump commit on main. The forge mirrors this repository, tags
# included, so nothing here pushes to it.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  ZIGBUILD_VERSION: '0.23.0'
  LLVM_VERSION: '21.1.2'
  LLVM_SHA256: '38dc1e278b8d688d9f4f1077da1dcda623d9e0dd89ffcf03bc18d3492bbd9cb6'
  # Named away from XWIN_VERSION on purpose: cargo-xwin reads that env as its
  # --xwin-version flag (the Windows SDK manifest), and a crate version there
  # kills every msvc build with "invalid digit found in string".
  XWIN_CRATE_VERSION: '0.23.1'
  MACOS_SDK_URL: 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz'
  MACOS_SDK_SHA256: 'cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4'
jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: [linux-amd64]
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: Next version, and the draft that will hold it
        id: v
        run: |
          set -euo pipefail
          top() { printf '%s\n' "$@" | sort -V | tail -n1; }
          tag=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1); tag=${tag#v}
          npmv=""
          for p in @hanzo/dev @hanzo/dev-darwin-arm64 @hanzo/dev-darwin-x64 @hanzo/dev-linux-x64-musl @hanzo/dev-linux-arm64-musl @hanzo/dev-win32-x64; do
            npmv=$(top "${npmv:-0.0.0}" "$(curl -fsS "https://registry.npmjs.org/$(printf '%s' "$p" | sed 's,/,%2F,')" | jq -r '."dist-tags".latest // "0.0.0"')")
          done
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          # A draft opened by a run still in flight is that run's claim on a
          # number: the tag and the npm package only appear when it publishes,
          # ~25 minutes later. Two runs that both skip this both pick the same
          # version, and the second one dies at `npm publish` having already
          # cross-built five targets.
          held=$(curl -fsS "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases?per_page=100" \
            | jq -r '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          base=$(top "${tag:-0.0.0}" "$npmv" "${held:-0.0.0}" "$(jq -r .version npm/package.json)")
          IFS=. read -r a b c <<<"$base"
          v="$a.$b.$((c+1))"
          rel=$(curl -s -X POST "${auth[@]}" https://api.github.com/repos/hanzoai/dev/releases \
            -d "$(jq -nc --arg t "v$v" --arg n "Release v$v" --arg sha "$GITHUB_SHA" \
              '{tag_name:$t,name:$n,target_commitish:$sha,draft:true}')" | jq -r '.id // empty')
          [ -n "$rel" ] || { echo "::error::could not open the draft release"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "release v$v (tag v${tag:-none}, npm $npmv) — draft $rel"

  build:
    name: ${{ matrix.target.id }}
    needs: version
    runs-on: [linux-amd64]
    # A build takes 70 minutes with the 6 CPUs it asks for. On 2026-10-07 the
    # cluster had one 8-CPU node left for all five, each got under 2, and both
    # Linux jobs were cancelled at 150 minutes, before they finished.
    # The limit sits at GitHub's ceiling so a crowded cluster slows a release
    # instead of failing it.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # No max-parallel. The platform starts one runner per job when the job is
      # queued, and a job held back by max-parallel waits past that runner's
      # life: on 2026-09-27 linux-amd64 built in 22 minutes and the four
      # targets queued behind it never got a runner.
      matrix:
        target:
          - { id: linux-amd64,   rust: x86_64-unknown-linux-musl }
          - { id: linux-arm64,   rust: aarch64-unknown-linux-musl }
          - { id: darwin-amd64,  rust: x86_64-apple-darwin,  apple: true }
          - { id: darwin-arm64,  rust: aarch64-apple-darwin, apple: true }
          - { id: windows-amd64, rust: x86_64-pc-windows-msvc, msvc: true }
    env:
      CODE_VERSION: ${{ needs.version.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: -Awarnings -C debuginfo=0 -C strip=symbols
      # Thin LTO's final link of this binary took 14 GB on one runner, and on
      # 2026-10-08 three of them on one 32 GB node ran it out of memory: a system
      # OOM, the node went NotReady, and every build on it was evicted. Without LTO
      # the link needs a fraction of that memory and time, for a larger binary.
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Without LTO, five builds on one such node still reached 79% of its memory
      # mid-compile and took it down at 100 minutes: each ran a rustc per CPU it
      # could see. Each gets under 2 CPUs on a full node, so two at a time costs
      # little time and halves the memory a build holds at once.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain deps
        run: |
          set -euo pipefail
          missing=""
          for t in cc make perl curl jq tar xz zstd zip sha256sum; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::the runner lacks:$missing"; exit 1; }
          echo "the toolchain is here"
      - name: Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; }
          export PATH="$HOME/.cargo/bin:$PATH"; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          CH=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$CH" --profile minimal
          rustup target add --toolchain "$CH" ${{ matrix.target.rust }}
      - name: Zig (the cross-linker)
        if: ${{ !matrix.target.msvc }}
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz \
            || curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version "${ZIGBUILD_VERSION}" --locked
      - name: Vendor macOS SDK
        if: ${{ matrix.target.apple }}
        run: |
          set -euo pipefail
          curl -fsSL "${MACOS_SDK_URL}" -o macsdk.tar.xz
          echo "${MACOS_SDK_SHA256}  macsdk.tar.xz" | sha256sum -c -
          tar -xf macsdk.tar.xz -C "$HOME"
          echo "SDKROOT=$HOME/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: LLVM for windows-msvc
        # clang-cl compiles the C the crates carry, lld-link links, llvm-lib
        # archives: three names for two binaries of one LLVM release. Only those
        # and clang's own headers leave the tarball.
        if: ${{ matrix.target.msvc }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" -o llvm.tar.xz
          echo "${LLVM_SHA256}  llvm.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm"
          tar -xJf llvm.tar.xz -C "$HOME/llvm" --strip-components=1 --wildcards \
            '*/bin/clang' '*/bin/clang-[0-9]*' '*/bin/lld' '*/bin/llvm-ar' '*/lib/clang/*'
          rm llvm.tar.xz
          ln -sf clang "$HOME/llvm/bin/clang-cl"
          ln -sf lld "$HOME/llvm/bin/lld-link"
          ln -sf llvm-ar "$HOME/llvm/bin/llvm-lib"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          "$HOME/llvm/bin/clang-cl" --version | head -1
          cargo install cargo-xwin --version "${XWIN_CRATE_VERSION}" --locked
      - name: Stamp the version
        # The tree names the version it is heading for (0.7.0-dev.1); a release
        # is the version it computed. The one string lives in the workspace
        # manifest, the path dependencies that pin it, the upstream edit that
        # gives upstream's crates the same version, and Cargo.lock, so it is
        # replaced in all of them and --locked still holds. Without this the
        # 0.6.107 build said 0.7.0-dev.1 and publish refused it.
        run: |
          set -euo pipefail
          cur=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$cur" ] || { echo "::error::no workspace version in Cargo.toml"; exit 1; }
          re=$(printf '%s' "$cur" | sed 's/[.]/\\./g')
          files=$(git ls-files 'Cargo.toml' '*/Cargo.toml' Cargo.lock patches/upstream.json)
          sed -i "s/$re/$CODE_VERSION/g" $files
          ! grep -l "$re" $files || { echo "::error::$cur is still named above"; exit 1; }
          echo "stamped $CODE_VERSION over $cur"
      - name: Apply the owned edits to the pinned upstream
        run: make prepare
      - name: Build
        run: |
          set -euo pipefail
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          case "${{ matrix.target.rust }}" in
            *apple-darwin|*linux-musl) cargo zigbuild --release --locked --target ${{ matrix.target.rust }} --bin dev ;;
            *windows-msvc)             cargo xwin build --release --locked --target ${{ matrix.target.rust }} --bin dev ;;
          esac
      - name: Package
        run: |
          set -euo pipefail
          t=${{ matrix.target.rust }}; short=${{ matrix.target.id }}
          bin="target/$t/release/dev"; mkdir -p dist; d=$(mktemp -d)
          if [ "$short" = windows-amd64 ]; then
            cp "$bin.exe" "$d/dev-$t.exe"; (cd "$d" && zip -q "$OLDPWD/dist/dev-$t.exe.zip" "dev-$t.exe")
            cp "$bin.exe" "$d/dev.exe"; tar -C "$d" -czf "dist/dev-$short.tar.gz" dev.exe
          else
            cp "$bin" "$d/dev-$t"; tar -C "$d" -czf "dist/dev-$t.tar.gz" "dev-$t"
            zstd -q -19 -T0 "$d/dev-$t" -o "dist/dev-$t.zst"
            cp "$bin" "$d/dev"; tar -C "$d" -czf "dist/dev-$short.tar.gz" dev
          fi
          (cd dist && for f in *; do case "$f" in *.sha256) ;; *) sha256sum "$f" > "$f.sha256";; esac; done)
          ls -la dist
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: Upload into the draft
        env:
          REL: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          for f in dist/*; do
            n=$(basename "$f")
            old=$(curl -s "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL/assets" | jq -r --arg n "$n" '.[]|select(.name==$n)|.id')
            for id in $old; do curl -s -X DELETE "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/assets/$id" >/dev/null; done
            code=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$f" "https://uploads.github.com/repos/hanzoai/dev/releases/$REL/assets?name=$n")
            [ "$code" = 201 ] || { echo "::error::upload $n failed ($code)"; cat /tmp/up.json; exit 1; }
            echo "uploaded $n"
          done

  publish:
    needs: [version, build]
    runs-on: [linux-amd64]
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: GitHub credential, from KMS
        # The forge org carries KMS_CLIENT_ID/SECRET and nothing else, so the old
        # `secrets.GH_PAT` expanded to empty and every call left as
        # "Authorization: Bearer " — GitHub answered 401, the draft was never
        # opened, and all five platform jobs skipped behind it.
        #
        # No jq: this step runs before any toolchain is provisioned, and the first
        # version of it died on `set -e` at a bare curl exit 22 that said nothing
        # about why. Text tools are always there, and each failure names itself.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          [ -n "${KMS_CLIENT_ID:-}" ] || { echo "::error::KMS_CLIENT_ID is empty"; exit 1; }
          [ -n "${KMS_CLIENT_SECRET:-}" ] || { echo "::error::KMS_CLIENT_SECRET is empty"; exit 1; }
          field() { sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          code=$(curl -s -o /tmp/kms.json -w '%{http_code}' "$KMS/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}")
          if [ "$code" != 200 ]; then
            echo "::error::KMS login answered $code"
            sed -e 's/[A-Za-z0-9_.-]\{16,\}/<redacted>/g' /tmp/kms.json
            exit 1
          fi
          T=$(field accessToken < /tmp/kms.json)
          [ -n "$T" ] || { echo "::error::KMS login returned no accessToken"; exit 1; }
          tok=""
          for path in secrets/GITHUB_TOKEN secrets/deploy/GITHUB_TOKEN orgs/hanzo/secrets/GITHUB_TOKEN; do
            c=$(curl -s -o /tmp/sec.json -w '%{http_code}' "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T")
            if [ "$c" != 200 ]; then echo "  $path -> $c"; continue; fi
            tok=$(field value < /tmp/sec.json)
            if [ -n "$tok" ]; then echo "  $path -> ok"; break; fi
          done
          [ -n "$tok" ] || { echo "::error::no GITHUB_TOKEN readable from KMS on any path"; exit 1; }
          echo "::add-mask::$tok"
          echo "GH_PAT=$tok" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          set -euo pipefail
          missing=""
          for t in curl jq git zstd node npm sha256sum; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::the runner lacks:$missing"; exit 1; }
          echo "the tools are here"
      - name: Every asset is present, then the release is real
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          mkdir -p dist
          curl -s "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL/assets?per_page=100" > /tmp/assets.json
          n=$(jq length /tmp/assets.json)
          [ "$n" -eq 28 ] || { echo "::error::draft holds $n assets, want 28 — a target is missing"; jq -r '.[].name' /tmp/assets.json; exit 1; }
          # Bytes need octet-stream ALONE: the auth array's vnd.github Accept
          # beside it made GitHub answer with asset metadata JSON, and every
          # "downloaded" file was the same twenty lines of JSON.
          jq -r '.[] | "\(.id) \(.name)"' /tmp/assets.json | while read -r id name; do
            curl -fsSL -H "Authorization: Bearer $GH_PAT" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/hanzoai/dev/releases/assets/$id" -o "dist/$name"
          done
          (cd dist && for s in *.sha256; do sha256sum -c "$s" >/dev/null; done)
          echo "28 assets present and checksum-clean"
          # The release runs what it ships: the linux binary is native to this
          # runner, so it answers for the whole matrix that the artifacts are
          # programs, not just well-named bytes.
          x=$(mktemp -d); tar -xzf dist/dev-linux-amd64.tar.gz -C "$x"
          "$x/dev" --version | grep -qF "$V" || { echo "::error::the shipped binary does not say $V"; "$x/dev" --version; exit 1; }
          "$x/dev" completion bash >/dev/null
          echo "smoked: $("$x/dev" --version)"
          curl -s -X PATCH "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL" \
            -d '{"draft":false}' | jq -r '"published: " + .html_url'
      - name: Publish npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          T=$(curl -sf "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r '.accessToken // empty')
          NPM_TOKEN=""
          for path in secrets/NPM_TOKEN secrets/deploy/NPM_TOKEN orgs/hanzo/secrets/NPM_TOKEN; do
            NPM_TOKEN=$(curl -sf "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T" | jq -r '.value // .secret.value // empty'); [ -z "$NPM_TOKEN" ] || break
          done
          [ -n "$NPM_TOKEN" ] || { echo "::error::NPM_TOKEN not readable from KMS"; exit 1; }
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          rm -rf "$RUNNER_TEMP/npm"; mkdir -p "$RUNNER_TEMP/npm"
          plat() { # plat <triple> <os> <cpu> <pkg> <short>
            local t=$1 os=$2 cpu=$3 pkg=$4 short=$5 d="$RUNNER_TEMP/npm/${4##*/}" x="$RUNNER_TEMP/x"
            # npm never takes a version twice: a rerun goes past what it already holds.
            if npm view "$pkg@$V" version >/dev/null 2>&1; then echo "$pkg@$V is published"; return 0; fi
            rm -rf "$x"; mkdir -p "$x" "$d/bin"
            tar -xzf "dist/dev-$short.tar.gz" -C "$x"
            if [ "$os" = win32 ]; then mv "$x/dev.exe" "$d/bin/dev-$t.exe"; else mv "$x/dev" "$d/bin/dev-$t"; chmod +x "$d/bin/dev-$t"; fi
            jq -n --arg n "$pkg" --arg v "$V" --arg t "$t" --arg os "$os" --arg cpu "$cpu" \
              '{name:$n,version:$v,license:"Apache-2.0",description:("Platform binary for @hanzo/dev ("+$t+")"),os:[$os],cpu:[$cpu],files:["bin/"]}' > "$d/package.json"
            (cd "$d" && npm publish --access public)
          }
          plat aarch64-apple-darwin darwin arm64 @hanzo/dev-darwin-arm64 darwin-arm64
          plat x86_64-apple-darwin darwin x64 @hanzo/dev-darwin-x64 darwin-amd64
          plat x86_64-unknown-linux-musl linux x64 @hanzo/dev-linux-x64-musl linux-amd64
          plat aarch64-unknown-linux-musl linux arm64 @hanzo/dev-linux-arm64-musl linux-arm64
          plat x86_64-pc-windows-msvc win32 x64 @hanzo/dev-win32-x64 windows-amd64
          # The launcher package lives in npm/ (it was codex-cli/ until the front
          # door moved it), and it names its dependencies as pnpm catalog
          # entries, which npm would publish verbatim and no installer resolves:
          # each `catalog:` becomes the version pnpm-workspace.yaml gives it.
          cp README.md npm/README.md
          cd npm
          npm version "$V" --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          import json, re
          catalog, inside = {}, False
          for line in open("../pnpm-workspace.yaml"):
              if re.match(r"^catalog:\s*$", line):
                  inside = True
                  continue
              if inside and line.strip() and not line.startswith(" "):
                  break
              m = inside and re.match(r"""^\s+['"]?([^'":]+)['"]?\s*:\s*['"]?([^'"\s]+)""", line)
              if m:
                  catalog[m.group(1)] = m.group(2)
          p = json.load(open("package.json"))
          for field in ("dependencies", "devDependencies", "optionalDependencies"):
              for name, spec in p.get(field, {}).items():
                  if spec == "catalog:":
                      if name not in catalog:
                          raise SystemExit(f"{name}: catalog: names no catalog entry")
                      p[field][name] = catalog[name]
          open("package.json", "w").write(json.dumps(p, indent=2) + "\n")
          PY
          t=$(mktemp); jq --arg v "$V" '.optionalDependencies |= with_entries(.value=$v)' package.json > "$t" && mv "$t" package.json
          if npm view "@hanzo/dev@$V" version >/dev/null 2>&1; then echo "@hanzo/dev@$V is published"; else CI=true npm publish --access public; fi
          git checkout -- README.md 2>/dev/null || true
      - name: Publish Homebrew formula
        run: |
          set -euo pipefail
          RELEASE_ASSETS_DIR=dist bash scripts/generate-homebrew-formula.sh "$V"
          grep -q "version \"$V\"" Formula/hanzo-dev.rb
          tap=$RUNNER_TEMP/tap; rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_PAT@github.com/hanzoai/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula" && cp Formula/hanzo-dev.rb "$tap/Formula/hanzo-dev.rb"
          cd "$tap"
          git -c user.name="Zach Kelling" -c user.email=z@zeekay.io commit --trailer "Co-authored-by: Hanzo Dev <dev@hanzo.ai>" -qam "hanzo-dev $V" && git push -q || echo "formula unchanged"
      - name: Bump
        run: |
          set -euo pipefail
          git add npm/package.json npm/package-lock.json Formula/hanzo-dev.rb 2>/dev/null || true
          git -c user.name="Zach Kelling" -c user.email=z@zeekay.io commit --trailer "Co-authored-by: Hanzo Dev <dev@hanzo.ai>" -qm "chore(release): $V [skip ci]"
          push() { git push "$1" HEAD:main && return
            git fetch "$1" main && git -c user.name="Zach Kelling" -c user.email=z@zeekay.io rebase FETCH_HEAD && git push "$1" HEAD:main; }
          push "https://x-access-token:$GH_PAT@github.com/hanzoai/dev.git"
