# Publishes @hanzo/dev (packages/dev), the Dev core as a library, when its package.json
# names a version npm does not serve yet. hanzo.ai takes it from npm. The question is asked
# of the registry, not of the diff, so a re-run is idempotent. The npm token is read from
# KMS at run time (NPM_TOKEN at the org root, env prod).
name: Publish @hanzo/dev

on:
  push:
    branches: [main]
    paths:
      - "packages/dev/package.json"
      - ".github/workflows/publish-dev-core.yml"
  workflow_dispatch:

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Is this version on npm?
        id: ahead
        run: |
          set -euo pipefail
          NAME=$(jq -r .name packages/dev/package.json)
          NEW=$(jq -r .version packages/dev/package.json)
          if curl -sf -o /dev/null "https://registry.npmjs.org/${NAME}/${NEW}"; then
            echo "${NAME} ${NEW} is already on npm"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.ahead.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.ahead.outputs.release == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Build the library
        if: steps.ahead.outputs.release == 'true'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter '@hanzodev/web...' --filter '@hanzo/dev...'
          (cd apps/web && ./node_modules/.bin/vp build --config vite.embed.config.ts)
          pnpm --filter @hanzo/dev run build:builder
          pnpm --filter @hanzo/dev run build:assemble
          test -s packages/dev/dist/index.js
          test -s packages/dev/dist/index.d.ts
          test -s packages/dev/dist/core.js
          test -s packages/dev/dist/core.d.ts
          test -s packages/dev/dist/builder/index.js
          test -s packages/dev/dist/builder/index.d.ts
          test -s packages/dev/dist/index.css

      # A host bundles this library itself: no file may call require("react"), and every package it
      # imports bare must be one package.json lists, or the host's bundler cannot resolve it.
      - name: Check the library for a host's bundler
        if: steps.ahead.outputs.release == 'true'
        run: node scripts/embed-dist-check.ts

      - name: Read the npm token from KMS
        if: steps.ahead.outputs.release == 'true'
        id: npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -uo pipefail
          body="{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}"
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}; resp=${out%$'\n'*}
          [ "$code" = "200" ] || { echo "::error::KMS login answered HTTP $code"; exit 1; }
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty')
          [ -n "$token" ] || { echo "::error::KMS login carried no accessToken"; exit 1; }
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/secrets/NPM_TOKEN?env=${KMS_SECRET_ENV}" -H "Authorization: Bearer ${token}")
          code=${out##*$'\n'}; resp=${out%$'\n'*}
          [ "$code" = "200" ] || { echo "::error::KMS secret read answered HTTP $code"; exit 1; }
          npm_token=$(printf '%s' "$resp" | jq -r '.value // empty')
          [ -n "$npm_token" ] || { echo "::error::No NPM_TOKEN in KMS"; exit 1; }
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.ahead.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm.outputs.token }}
        run: |
          set -euo pipefail
          cd packages/dev
          pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
          pnpm publish --access public --no-git-checks --registry https://registry.npmjs.org
