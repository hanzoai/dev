[workspace]
members = ["crates/hanzo-dev", "crates/hanzo-config", "crates/hanzo-tui"]
exclude = ["upstream", "crates/hanzo-upstream"]
resolver = "2"

[workspace.package]
version = "0.7.0-dev.1"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal
codex-realtime-webrtc = { path = "upstream/codex/codex-rs/realtime-webrtc" }
