# Release — every push to main ships `dev`, from the Linux pool.
#
# No macOS or Windows runner is needed, and none is used: `cargo-zigbuild`
# cross-links the darwin targets against a vendored, checksum-pinned MacOSX
# SDK and the musl targets natively, and `cargo-xwin` builds windows-msvc with
# LLVM's clang-cl — all from ordinary amd64 containers, five in parallel. This
# is the same pattern hanzoai/cli has shipped its five platforms with; it
# replaced a single-Mac lane whose host froze under every full build.
#
# Shape: `version` computes the next patch above everything already published
# and opens a DRAFT GitHub release; five `build` jobs each compile one target
# and upload its assets into the draft by id; `publish` verifies all 28
# assets, publishes the release (which mints the tag), mirrors it to the
# forge, publishes npm (five platform packages, then @hanzo/dev), pushes the
# Homebrew formula, and lands the version-bump commit on main.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  ZIGBUILD_VERSION: '0.23.0'
  # Named away from XWIN_VERSION on purpose: cargo-xwin reads that env as its
  # --xwin-version flag (the Windows SDK manifest), and a crate version there
  # kills every msvc build with "invalid digit found in string".
  XWIN_CRATE_VERSION: '0.23.1'
  MACOS_SDK_URL: 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz'
  MACOS_SDK_SHA256: 'cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4'
jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: hanzo-build-linux-amd64
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version, and the draft that will hold it
        id: v
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          top() { printf '%s\n' "$@" | sort -V | tail -n1; }
          tag=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1); tag=${tag#v}
          npmv=""
          for p in @hanzo/dev @hanzo/dev-darwin-arm64 @hanzo/dev-darwin-x64 @hanzo/dev-linux-x64-musl @hanzo/dev-linux-arm64-musl @hanzo/dev-win32-x64; do
            npmv=$(top "${npmv:-0.0.0}" "$(curl -fsS "https://registry.npmjs.org/$(printf '%s' "$p" | sed 's,/,%2F,')" | jq -r '."dist-tags".latest // "0.0.0"')")
          done
          base=$(top "${tag:-0.0.0}" "$npmv" "$(jq -r .version codex-cli/package.json)")
          IFS=. read -r a b c <<<"$base"
          v="$a.$b.$((c+1))"
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          rel=$(curl -s -X POST "${auth[@]}" https://api.github.com/repos/hanzoai/dev/releases \
            -d "$(jq -nc --arg t "v$v" --arg n "Release v$v" --arg sha "$GITHUB_SHA" \
              '{tag_name:$t,name:$n,target_commitish:$sha,draft:true}')" | jq -r '.id // empty')
          [ -n "$rel" ] || { echo "::error::could not open the draft release"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "release v$v (tag v${tag:-none}, npm $npmv) — draft $rel"

  build:
    name: ${{ matrix.target.id }}
    needs: version
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: linux-amd64,   rust: x86_64-unknown-linux-musl }
          - { id: linux-arm64,   rust: aarch64-unknown-linux-musl }
          - { id: darwin-amd64,  rust: x86_64-apple-darwin,  apple: true }
          - { id: darwin-arm64,  rust: aarch64-apple-darwin, apple: true }
          - { id: windows-amd64, rust: x86_64-pc-windows-msvc, msvc: true }
    env:
      CODE_VERSION: ${{ needs.version.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: -Awarnings -C debuginfo=0 -C strip=symbols
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl jq tar xz-utils zstd zip
      - name: Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; }
          export PATH="$HOME/.cargo/bin:$PATH"; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          CH=$(sed -n 's/^channel = "\(.*\)"/\1/p' code-rs/rust-toolchain.toml)
          rustup toolchain install "$CH" --profile minimal
          rustup target add --toolchain "$CH" ${{ matrix.target.rust }}
      - name: Zig (the cross-linker)
        if: ${{ !matrix.target.msvc }}
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz \
            || curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version "${ZIGBUILD_VERSION}" --locked
      - name: Vendor macOS SDK
        if: ${{ matrix.target.apple }}
        run: |
          set -euo pipefail
          curl -fsSL "${MACOS_SDK_URL}" -o macsdk.tar.xz
          echo "${MACOS_SDK_SHA256}  macsdk.tar.xz" | sha256sum -c -
          tar -xf macsdk.tar.xz -C "$HOME"
          echo "SDKROOT=$HOME/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: LLVM for windows-msvc
        if: ${{ matrix.target.msvc }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends clang lld llvm clang-tools
          for t in clang-cl lld-link llvm-lib; do
            command -v "$t" >/dev/null && continue
            src=$(ls /usr/bin/${t}-* /usr/lib/llvm-*/bin/$t 2>/dev/null | sort -V | tail -n1)
            [ -n "$src" ] || { echo "::error::$t not provided by the llvm packages"; exit 1; }
            sudo ln -sf "$src" "/usr/local/bin/$t"
          done
          cargo install cargo-xwin --version "${XWIN_CRATE_VERSION}" --locked
      - name: Build
        working-directory: code-rs
        run: |
          set -euo pipefail
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          case "${{ matrix.target.rust }}" in
            *apple-darwin|*linux-musl) cargo zigbuild --release --locked --target ${{ matrix.target.rust }} --bin dev ;;
            *windows-msvc)             cargo xwin build --release --locked --target ${{ matrix.target.rust }} --bin dev ;;
          esac
      - name: Package
        run: |
          set -euo pipefail
          t=${{ matrix.target.rust }}; short=${{ matrix.target.id }}
          bin="code-rs/target/$t/release/dev"; mkdir -p dist; d=$(mktemp -d)
          if [ "$short" = windows-amd64 ]; then
            cp "$bin.exe" "$d/dev-$t.exe"; (cd "$d" && zip -q "$OLDPWD/dist/dev-$t.exe.zip" "dev-$t.exe")
            cp "$bin.exe" "$d/dev.exe"; tar -C "$d" -czf "dist/dev-$short.tar.gz" dev.exe
          else
            cp "$bin" "$d/dev-$t"; tar -C "$d" -czf "dist/dev-$t.tar.gz" "dev-$t"
            zstd -q -19 -T0 "$d/dev-$t" -o "dist/dev-$t.zst"
            cp "$bin" "$d/dev"; tar -C "$d" -czf "dist/dev-$short.tar.gz" dev
          fi
          (cd dist && for f in *; do case "$f" in *.sha256) ;; *) sha256sum "$f" > "$f.sha256";; esac; done)
          ls -la dist
      - name: Upload into the draft
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REL: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          for f in dist/*; do
            n=$(basename "$f")
            old=$(curl -s "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL/assets" | jq -r --arg n "$n" '.[]|select(.name==$n)|.id')
            for id in $old; do curl -s -X DELETE "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/assets/$id" >/dev/null; done
            code=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$f" "https://uploads.github.com/repos/hanzoai/dev/releases/$REL/assets?name=$n")
            [ "$code" = 201 ] || { echo "::error::upload $n failed ($code)"; cat /tmp/up.json; exit 1; }
            echo "uploaded $n"
          done

  publish:
    needs: [version, build]
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq git zstd
          command -v node >/dev/null || { curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -; sudo apt-get install -y nodejs; }
      - name: Every asset is present, then the release is real
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json")
          mkdir -p dist
          curl -s "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL/assets?per_page=100" > /tmp/assets.json
          n=$(jq length /tmp/assets.json)
          [ "$n" -eq 28 ] || { echo "::error::draft holds $n assets, want 28 — a target is missing"; jq -r '.[].name' /tmp/assets.json; exit 1; }
          # Bytes need octet-stream ALONE: the auth array's vnd.github Accept
          # beside it made GitHub answer with asset metadata JSON, and every
          # "downloaded" file was the same twenty lines of JSON.
          jq -r '.[] | "\(.id) \(.name)"' /tmp/assets.json | while read -r id name; do
            curl -fsSL -H "Authorization: Bearer $GH_PAT" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/hanzoai/dev/releases/assets/$id" -o "dist/$name"
          done
          (cd dist && for s in *.sha256; do sha256sum -c "$s" >/dev/null; done)
          echo "28 assets present and checksum-clean"
          curl -s -X PATCH "${auth[@]}" "https://api.github.com/repos/hanzoai/dev/releases/$REL" \
            -d '{"draft":false}' | jq -r '"published: " + .html_url'
      - name: Mirror the release to the forge
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${FORGE_TOKEN:-}" ] || { echo "no FORGE_TOKEN — skipping forge mirror"; exit 0; }
          git push "https://x:$FORGE_TOKEN@git.hanzo.ai/hanzoai/dev.git" "$GITHUB_SHA:refs/tags/v$V" || true
          a() { curl -fsS -H "Authorization: token $FORGE_TOKEN" -H 'Accept: application/json' "$@"; }
          rel=$(a "https://git.hanzo.ai/v1/repos/hanzoai/dev/releases/tags/v$V" 2>/dev/null | jq -r '.id // empty' || true)
          [ -n "$rel" ] || rel=$(a -X POST "https://git.hanzo.ai/v1/repos/hanzoai/dev/releases" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "v$V" --arg n "Release v$V" '{tag_name:$t,name:$n}')" | jq -r .id)
          for f in dist/*; do a -X POST -F "attachment=@$f" "https://git.hanzo.ai/v1/repos/hanzoai/dev/releases/$rel/assets?name=$(basename "$f")" >/dev/null || true; done
          echo "forge release mirrored"
      - name: Publish npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          KMS=${KMS_ENDPOINT:-https://api.hanzo.ai}
          T=$(curl -sf "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r '.accessToken // empty')
          NPM_TOKEN=""
          for path in secrets/NPM_TOKEN secrets/deploy/NPM_TOKEN orgs/hanzo/secrets/NPM_TOKEN; do
            NPM_TOKEN=$(curl -sf "$KMS/v1/kms/$path?env=prod" -H "Authorization: Bearer $T" | jq -r '.value // .secret.value // empty'); [ -z "$NPM_TOKEN" ] || break
          done
          [ -n "$NPM_TOKEN" ] || { echo "::error::NPM_TOKEN not readable from KMS"; exit 1; }
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          rm -rf "$RUNNER_TEMP/npm"; mkdir -p "$RUNNER_TEMP/npm"
          plat() { # plat <triple> <os> <cpu> <pkg> <short>
            local t=$1 os=$2 cpu=$3 pkg=$4 short=$5 d="$RUNNER_TEMP/npm/${4##*/}" x="$RUNNER_TEMP/x"
            rm -rf "$x"; mkdir -p "$x" "$d/bin"
            tar -xzf "dist/dev-$short.tar.gz" -C "$x"
            if [ "$os" = win32 ]; then mv "$x/dev.exe" "$d/bin/dev-$t.exe"; else mv "$x/dev" "$d/bin/dev-$t"; chmod +x "$d/bin/dev-$t"; fi
            jq -n --arg n "$pkg" --arg v "$V" --arg t "$t" --arg os "$os" --arg cpu "$cpu" \
              '{name:$n,version:$v,license:"Apache-2.0",description:("Platform binary for @hanzo/dev ("+$t+")"),os:[$os],cpu:[$cpu],files:["bin/"]}' > "$d/package.json"
            (cd "$d" && npm publish --access public)
          }
          plat aarch64-apple-darwin darwin arm64 @hanzo/dev-darwin-arm64 darwin-arm64
          plat x86_64-apple-darwin darwin x64 @hanzo/dev-darwin-x64 darwin-amd64
          plat x86_64-unknown-linux-musl linux x64 @hanzo/dev-linux-x64-musl linux-amd64
          plat aarch64-unknown-linux-musl linux arm64 @hanzo/dev-linux-arm64-musl linux-arm64
          plat x86_64-pc-windows-msvc win32 x64 @hanzo/dev-win32-x64 windows-amd64
          cp README.md codex-cli/README.md
          cd codex-cli
          npm version "$V" --no-git-tag-version --allow-same-version
          t=$(mktemp); jq --arg v "$V" '.optionalDependencies |= with_entries(.value=$v)' package.json > "$t" && mv "$t" package.json
          CI=true npm publish --access public
          git checkout -- README.md 2>/dev/null || true
      - name: Publish Homebrew formula
        run: |
          set -euo pipefail
          RELEASE_ASSETS_DIR=dist bash scripts/generate-homebrew-formula.sh "$V"
          grep -q "version \"$V\"" Formula/hanzo-dev.rb
          tap=$RUNNER_TEMP/tap; rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_PAT@github.com/hanzoai/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula" && cp Formula/hanzo-dev.rb "$tap/Formula/hanzo-dev.rb"
          cd "$tap"
          git -c user.name=hanzo-dev -c user.email=dev@hanzo.ai commit -qam "hanzo-dev $V" && git push -q || echo "formula unchanged"
      - name: Bump
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail
          git add codex-cli/package.json codex-cli/package-lock.json Formula/hanzo-dev.rb 2>/dev/null || true
          git -c user.name=hanzo-dev -c user.email=dev@hanzo.ai commit -qm "chore(release): $V [skip ci]"
          push() { git push "$1" HEAD:main && return
            git fetch "$1" main && git -c user.name=hanzo-dev -c user.email=dev@hanzo.ai rebase FETCH_HEAD && git push "$1" HEAD:main; }
          push "https://x-access-token:$GH_PAT@github.com/hanzoai/dev.git"
          [ -z "${FORGE_TOKEN:-}" ] || push "https://x:$FORGE_TOKEN@git.hanzo.ai/hanzoai/dev.git" || true
