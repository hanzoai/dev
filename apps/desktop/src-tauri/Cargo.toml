[package]
name = "hanzo-dev-desktop"
version = "0.1.10"
description = "Hanzo Dev — Native Tauri Desktop Control Plane"
authors = ["Hanzo AI Inc. <dev@hanzo.ai>"]
license = "MIT"
repository = "https://github.com/hanzoai/dev-desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36.0", features = [
  "macros",
  "rt-multi-thread",
  "rt",
  "net",
  "sync",
  "io-util",
  "process",
  "time",
] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
hex = "0.4.3"
base64 = "0.22.1"
rand = "0.8"
dirs = "6.0"
opener = "0.7.2"
sysinfo = "0.30.12"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
